name: Generate narration audio

# Renders every story card to MP3 with Microsoft Edge TTS
# (en-US-AndrewNeural at +15% rate) and commits the results back to the
# branch. Run it from the Actions tab, or push a change to stories/ or cards/.
#
# This workflow exists because the Microsoft speech endpoint can only be
# reached from a normal network; GitHub-hosted runners have that access.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render cards that already have an MP3"
        type: boolean
        default: false
  push:
    paths:
      - "stories/**"
      - "cards/**"
      - "scripts/generate_audio.py"
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

concurrency:
  group: generate-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Rebuild card text from the source
        run: python scripts/parse_cards.py

      - name: Render cards with edge-tts
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/generate_audio.py --force --concurrency 4
          else
            python scripts/generate_audio.py --concurrency 4
          fi

      - name: Commit the audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            count=$(git diff --cached --name-only -- 'audio/*.mp3' | wc -l)
            git commit -m "Add edge-tts narration audio (${count} MP3 cards, en-US-AndrewNeural +15%)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
