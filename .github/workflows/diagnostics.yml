name: Diagnostics

# One-off connectivity probe: can a GitHub-hosted runner reach the Microsoft
# Edge TTS endpoint that edge-tts uses? Writes the answer to a file and
# commits it, so the result is readable without access to job logs.

on:
  # push trigger so this can run from a feature branch
  # (workflow_dispatch only works for workflows on the default branch)
  push:
    paths:
      - "diagnostics/trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Probe the speech endpoint
        run: |
          mkdir -p diagnostics
          REPORT=diagnostics/actions-network.txt
          {
            echo "run:           $GITHUB_RUN_ID"
            echo "runner:        $(uname -srm)"
            echo "python:        $(python3 --version)"
            echo "edge-tts:      $(pip show edge-tts | awk '/^Version/{print $2}')"
            echo "date:          $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- DNS ---"
            getent hosts speech.platform.bing.com || echo "DNS FAILED"
            echo
            echo "--- TCP 443 ---"
            timeout 10 bash -c 'cat < /dev/null > /dev/tcp/speech.platform.bing.com/443' \
              && echo "tcp connect: OK" || echo "tcp connect: FAILED"
            echo
            echo "--- TLS + voices list (curl) ---"
            curl -sS -o /dev/null -w "http_code=%{http_code} time=%{time_total}s\n" --max-time 20 \
              "https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/voices/list?trustedclienttoken=6A5AA1D4EAFF4E9FB37E23D68491D6F4" \
              2>&1 || echo "curl FAILED"
            echo
            echo "--- actual synthesis through edge-tts (Andrew Neural, +15%) ---"
            START=$(date +%s)
            python3 -c "
          import asyncio, edge_tts
          async def main():
              c = edge_tts.Communicate('Hello. You found me. I am the bottom half of a spacecraft called Eagle.', 'en-US-AndrewNeural', rate='+15%')
              await c.save('/tmp/probe.mp3')
          asyncio.run(main())
          " 2>&1 || echo "SYNTHESIS FAILED"
            END=$(date +%s)
            echo "synthesis elapsed: $((END-START))s"
            ls -l /tmp/probe.mp3 2>/dev/null || echo "no mp3 produced"
            echo
            echo "--- verdict ---"
            if [ -s /tmp/probe.mp3 ]; then
              echo "RESULT: edge-tts WORKS on this runner"
            else
              echo "RESULT: edge-tts BLOCKED on this runner"
            fi
          } > "$REPORT" 2>&1
          cat "$REPORT"

      - name: Commit the report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/actions-network.txt
          git diff --cached --quiet || git commit -m "Add Actions connectivity report"
          git push origin "HEAD:${GITHUB_REF_NAME}"
