name: Generate narration audio

# Renders every story card to an MP3 with Microsoft Edge TTS
# (en-US-AndrewNeural at +15%) and commits the results back to the branch.
#
# Normally you do not need this: clone the repo and run
#   python3 scripts/parse_cards.py
#   python3 scripts/generate_audio.py
# locally. This workflow is a convenience for machines that cannot reach
# Microsoft's speech endpoint.

on:
  # push trigger on a marker file so runs can be started from a feature branch
  # (workflow_dispatch only works for workflows that live on the default branch)
  push:
    paths:
      - "render/trigger"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render cards that already have an MP3"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Rebuild card folders and scripts from the source text
        run: python3 scripts/parse_cards.py

      - name: Render cards with edge-tts
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python3 scripts/generate_audio.py --force --concurrency 3
          else
            python3 scripts/generate_audio.py --concurrency 3
          fi

      - name: Commit the audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ stories/stories.json
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            count=$(git diff --cached --name-only -- 'audio/*/card-*/narration.mp3' | wc -l)
            git commit -m "Add edge-tts narration (${count} cards, en-US-AndrewNeural +15%)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
